<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<title>Amor Explosivo — Celular</title>
<link rel="stylesheet" href="style.css?v=22">
<link rel="stylesheet" href="style-mobile.css?v=22">
</head>
<body data-platform="mobile">
<div id="wrap">
  <canvas id="game"></canvas>
  <div id="hud"><div id="count">💕 0 / 0<small>apaixonados</small></div><div id="obj"></div></div>
  <div id="bars">
    <span class="barLbl">AMOR</span><div class="bar"><div id="amorFill" class="fill"></div></div>
    <span class="barLbl">CANSAÇO</span><div class="bar"><div id="stamFill" class="fill"></div></div>
  </div>
  <div id="touch">
    <div class="tbtn" id="bCharge">❤</div>
    <div class="tbtn" id="bPow">★</div>
    <div class="tbtn" id="bCyc">⇄</div>
    <div class="tbtn" id="bDiv" style="display:none">✨</div>
  </div>
  <div id="overlay"></div>
</div>
<div id="rotate"><div class="rot-ico">📱</div><p>Gire o celular para jogar 🔄</p></div>
<script src="game.js?v=22"></script>
</body>
</html>
