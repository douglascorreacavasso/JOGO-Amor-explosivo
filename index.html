<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<title>Amor Explosivo</title>
<style>html,body{margin:0;height:100%;background:radial-gradient(circle at 50% 40%,#2a1250,#140d33 60%,#0b0720);color:#ffd6e0;font-family:"Trebuchet MS",sans-serif;display:flex;flex-direction:column;gap:12px;align-items:center;justify-content:center}
.bola{width:76px;height:76px;border-radius:50%;border:4px solid rgba(255,143,171,.18);border-top-color:#ff8fab;border-right-color:#ff2e63;animation:g .9s linear infinite}@keyframes g{to{transform:rotate(360deg)}}</style>
</head>
<body>
<div class="bola" role="status" aria-label="carregando"></div><p>Amor Explosivo · abrindo no modo certo do seu aparelho…</p>
<script>
(function(){
  var ua = navigator.userAgent || '';
  var uaMobile = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini|Mobile|Tablet/i.test(ua);
  var touch = ('ontouchstart' in window) || (navigator.maxTouchPoints||0) > 0;
  var small = Math.min(window.innerWidth, window.innerHeight) < 820;
  var isMobile = uaMobile || (touch && small);
  location.replace((isMobile ? 'mobile.html' : 'desktop.html') + '?v=31');
})();
</script>
<noscript><p>Ative o JavaScript. <a href="desktop.html">PC</a> · <a href="mobile.html">Celular</a></p></noscript>
</body>
</html>
